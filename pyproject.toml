[project]
name = "faculty-allocator"
version = "0.1.0"
description = "Allocate faculty and research scholars to course sections from department preference forms, using OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ortools>=9.10",
    "pydantic>=2.6",
    # Multipart file uploads (POST /api/problems/import with a form field).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Test client transport; starlette prefers httpx2 over httpx.
    "httpx2>=2",
    # Only to cross-check the stdlib .xlsx reader and writer in tests;
    # nothing at run time imports it.
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
