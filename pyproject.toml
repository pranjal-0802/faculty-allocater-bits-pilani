[project]
name = "faculty-allocator"
version = "0.1.0"
description = "Allocate faculty and research scholars to course sections from department preference forms, using OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ortools>=9.10",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
